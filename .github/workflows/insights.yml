name: Weekly insights

on:
  schedule:
    - cron: "0 0 * * 0"   # 매주 일요일 KST 09:00
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: cardnews-post
  cancel-in-progress: false

jobs:
  insights:
    runs-on: ubuntu-latest
    env:
      TZ: Asia/Seoul
      GRAPH_API_VERSION: ${{ vars.GRAPH_API_VERSION || 'v23.0' }}
      IG_USER_ID: ${{ secrets.IG_USER_ID }}
      IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests PyYAML
      - run: python -m src.insights --days 7 --telegram
      - name: Commit report
        run: |
          git config user.name "cardnews-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/insights
          git diff --cached --quiet || (git commit -m "insights: weekly report" && git pull --rebase && git push)
